<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Chemnitz – Entwurf 4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*
 * Entwurf 4 · kombiniert, angelehnt an Dice
 * Ruhige Schwarz-Weiß-Fläche, Farbe kommt nur aus den Event-Covern.
 * Von oben: Highlight-Karussell → Tagesleiste (klebt oben) → Tagesliste mit Tages-Highlights → Karussell Regelmäßiges
 */
:root {
  --bg: #FFFFFF;
  --surface: #F4F4F5;          /* ruhige Flächen */
  --fg: #0B0B0C;
  --fg2: #6B6B72;              /* Nebentext */
  --fg3: #A1A1A8;              /* abgewählte Filter */
  --line: rgba(11,11,12,.09);
  --line-strong: rgba(11,11,12,.22);
  --heart: #FF2D46;
  --glass: rgba(255,255,255,.82);
  --scrim: rgba(0,0,0,.4);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --bar-h: 56px;
  --days-h: 52px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --surface: #161618; --fg: #F5F5F7; --fg2: #9C9CA3; --fg3: #5C5C63; --line: rgba(255,255,255,.09); --line-strong: rgba(255,255,255,.26); --heart: #FF4D5E; --glass: rgba(0,0,0,.72); --scrim: rgba(0,0,0,.66); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #000000; --surface: #161618; --fg: #F5F5F7; --fg2: #9C9CA3; --fg3: #5C5C63; --line: rgba(255,255,255,.09); --line-strong: rgba(255,255,255,.26); --heart: #FF4D5E; --glass: rgba(0,0,0,.72); --scrim: rgba(0,0,0,.66); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ico { width: 22px; height: 22px; flex: none; }

/* ---------- Kopfleiste ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); }
.bar-in { height: var(--bar-h); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 19px; letter-spacing: -.02em; color: var(--fg); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.brand span { color: var(--fg2); font-weight: 600; }
.fav-btn { appearance: none; border: 0; background: var(--fg); color: var(--bg); height: 30px; padding: 0 10px 0 8px; border-radius: 8px; display: inline-flex; align-items: center; gap: 5px; font-weight: 650; font-size: 12.5px; cursor: pointer; flex: none; }
.fav-btn .ico { width: 15px; height: 15px; }
.fav-btn .n { font-variant-numeric: tabular-nums; opacity: .7; }
.fav-btn.bump { animation: bump .35s ease; }
@keyframes bump { 50% { transform: scale(1.08); } }

/* ---------- Einleitung + Filter ---------- */
.intro { padding-block: 4px 0; }
.filters { display: flex; gap: 2px 20px; overflow-x: auto; scrollbar-width: none; margin: 6px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; padding: 0 max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.filters::-webkit-scrollbar { display: none; }
.flt { appearance: none; border: 0; background: none; padding: 12px 0 11px; min-height: 44px; font-size: 15.5px; font-weight: 600; color: var(--fg3); white-space: nowrap; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; flex: none; }
.flt[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--fg); }
.flt.all { padding-right: 16px; border-right: 1px solid var(--line); border-bottom-color: transparent; }
.flt.all[aria-pressed="true"] { color: var(--fg); }
.toast { position: fixed; z-index: 40; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); display: flex; gap: 10px; align-items: center; background: var(--fg); color: var(--bg); font-size: 13.5px; line-height: 1.35; padding: 10px 14px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.22); animation: fade .25s ease; }
.toast .ico { width: 16px; height: 16px; }
.toast button { appearance: none; border: 0; background: none; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; flex: none; font-size: 13px; }

/* ---------- Abschnittsköpfe ---------- */
.sec { margin-top: 26px; }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.sec-head h2 { font-family: var(--font-display); font-size: 24px; letter-spacing: -.02em; line-height: 1.1; margin: 0; }
.sec-head p { margin: 3px 0 0; color: var(--fg2); font-size: 14px; }
.arrows { display: none; gap: 6px; }
@media (hover: hover) and (min-width: 760px) { .arrows { display: flex; } }
.arrow { appearance: none; border: 1px solid var(--line-strong); background: none; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: var(--fg); }
.arrow .ico { width: 18px; height: 18px; }

/* ---------- Karussells ---------- */
.rail { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain;
  margin: 14px calc(-1 * max(16px, env(safe-area-inset-right, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px));
  scroll-padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.rail::-webkit-scrollbar { display: none; }
@media (min-width: 1152px) { .rail { margin-inline: 0; padding-inline: 0; scroll-padding-inline: 0; } }
#heroRail { scroll-snap-type: x mandatory; }
.track { display: flex; flex: none; gap: inherit; will-change: transform; }

.card { flex: none; width: 132px; scroll-snap-align: start; cursor: pointer; min-width: 0; }
.card .cv { position: relative; aspect-ratio: 4 / 5; border-radius: 10px; overflow: hidden; background: var(--surface); max-width: 100%; }
.card .cv img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
.card:hover .cv img { transform: scale(1.03); }
.card .cv video { width: 100%; height: 100%; object-fit: cover; display: block; }
/* Besondere Momente: Bild ohne Video/WebP bekommt einen langsamen Zoom, aber nur solange die Karte sichtbar ist */
.card.lg .cv img:not([data-webp]) { animation: drift 9s ease-in-out infinite alternate paused; }
.card.lg.live .cv img { animation-play-state: running; }
@keyframes drift { to { transform: scale(1.14) translate(-3%, -2%); } }
.card .c-date { margin-top: 7px; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--fg); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
/* Lange Titel und Texte bleiben in der Karte und enden mit „…“ */
.card h3 { font-family: var(--font-display); font-size: 13.5px; line-height: 1.2; letter-spacing: -.01em; margin: 2px 0 0; text-wrap: balance;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; -webkit-hyphens: auto; hyphens: auto; }
.card .c-place, .card .c-price, .row .su { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .c-place { color: var(--fg2); font-size: 12px; margin-top: 2px; }
.card .c-price { font-size: 12px; font-weight: 600; margin-top: 3px; }
.card.md { width: min(60vw, 230px); }
.card.md .cv { aspect-ratio: 1 / 1; border-radius: 14px; }
.card.md .c-date { margin-top: 10px; font-size: 12.5px; }
.card.md h3 { font-size: 17px; line-height: 1.18; margin-top: 3px; }
.card.md .c-place, .card.md .c-price { font-size: 14px; margin-top: 3px; }
.card.sm { width: 112px; }
.card.sm .cv { aspect-ratio: 1 / 1; border-radius: 8px; }
.card.sm .c-date { margin-top: 6px; font-size: 10px; }
.card.sm h3 { font-size: 12.5px; -webkit-line-clamp: 2; }
.card.sm .c-place { font-size: 11.5px; }

/* Herz auf dem Cover */
.heart { appearance: none; border: 0; background: none; width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; color: var(--fg2); flex: none; border-radius: 50%; -webkit-tap-highlight-color: transparent; }
.heart[aria-pressed="true"] { color: var(--heart); }
.heart:active .ico { transform: scale(.85); }
.cv .heart { position: absolute; right: 0; top: 0; width: 40px; height: 40px; color: #fff; }
.cv .heart span { width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.42); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: grid; place-items: center; }
.cv .heart[aria-pressed="true"] span { background: #fff; color: var(--heart); }
.cv .heart .ico { width: 15px; height: 15px; }
.card.md .cv .heart { right: 4px; top: 4px; width: 44px; height: 44px; }
.card.md .cv .heart span { width: 34px; height: 34px; }
.card.md .cv .heart .ico { width: 19px; height: 19px; }

/* ---------- Tagesleiste ---------- */
.days { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h)); z-index: 15; background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); margin-top: 30px; }
.days-strip, .later-strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; align-items: center; }
.days-strip { height: var(--days-h); }
.days-strip::-webkit-scrollbar, .later-strip::-webkit-scrollbar { display: none; }
.dbtn, .pbtn, .today-btn { appearance: none; border: 1px solid var(--line); background: none; flex: none; border-radius: 8px; cursor: pointer; color: var(--fg); }
.dbtn { width: 46px; height: 42px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.later { display: flex; align-items: center; gap: 8px; padding-bottom: 7px; }
.later > span { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fg2); flex: none; }
.later-strip { flex: 1; min-width: 0; }
.pbtn, .today-btn { height: 28px; padding: 0 10px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.today-btn { background: var(--surface); border-color: transparent; }
.dbtn small { font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--fg2); }
.dbtn b { font-size: 16px; line-height: 1.05; font-variant-numeric: tabular-nums; font-weight: 700; }
.dbtn .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--fg); margin-top: 2px; }
.dbtn[aria-current="true"], .pbtn[aria-current="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.dbtn[aria-current="true"] small { color: var(--bg); opacity: .7; }
.dbtn[aria-current="true"] .dot { background: var(--bg); }
.dbtn:disabled, .pbtn:disabled { opacity: .35; cursor: default; }
.more { display: flex; justify-content: center; padding-top: 20px; }

/* ---------- Tagesliste ---------- */
.day { padding-top: 22px; }
.day-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.day-h h2 { font-family: var(--font-display); font-size: 26px; letter-spacing: -.02em; margin: 0; }
.day-h .d { color: var(--fg2); font-size: 15px; }
.day-h .n { margin-left: auto; color: var(--fg2); font-size: 13px; }
.day .rail { margin-top: 12px; }
.table { margin-top: 14px; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 50px 52px minmax(0, 1fr) 44px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; min-height: 72px; }
.row:hover { background: linear-gradient(90deg, transparent, var(--surface) 8%, var(--surface) 92%, transparent); }
.row .time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15.5px; line-height: 1.2; }
.row .time small { display: block; font-weight: 500; font-size: 12.5px; color: var(--fg2); }
.row .thumb { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: var(--surface); }
.row .main { min-width: 0; }
.row .ti { font-weight: 650; font-size: 15.5px; line-height: 1.25; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; -webkit-hyphens: auto; hyphens: auto; }
.row .su { margin-top: 3px; font-size: 13px; color: var(--fg2); }
.row .cat { display: none; }
@media (min-width: 760px) {
  .row { grid-template-columns: 64px 56px minmax(0, 1fr) 150px 44px; }
  .row .thumb { width: 56px; height: 56px; }
  .row .cat { display: block; font-size: 13.5px; color: var(--fg2); }
}
.empty { color: var(--fg2); padding: 18px 0; font-size: 14.5px; }

footer { color: var(--fg2); font-size: 12.5px; text-align: center; padding-block: 36px calc(36px + env(safe-area-inset-bottom, 0px)); }
footer a { color: var(--fg); }
.legal { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 18px; margin-top: 10px; }
.legal a { color: var(--fg2); }
/* Hinweis zur Speicherung: unten, liegt unter Detail- und Teilen-Fenster */
.consent { position: fixed; z-index: 50; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); box-shadow: 0 -6px 24px rgba(0,0,0,.08);
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.consent-in { max-width: 560px; margin: 0 auto; display: grid; gap: 10px; }
.consent p { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--fg2); }
.consent strong, .consent a { color: var(--fg); }

/* ---------- Fenster (Details, Merkliste, Teilen) ---------- */
.backdrop { position: fixed; inset: 0; z-index: 100; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
.sheet { background: var(--bg); color: var(--fg); width: 100%; max-width: 560px; max-height: 92%; overflow: auto; border-radius: 18px 18px 0 0; animation: up .28s cubic-bezier(.2,.8,.2,1);
  padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
@media (min-width: 700px) { .backdrop { align-items: center; } .sheet { border-radius: 18px; } }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--line-strong); margin: 0 auto 12px; }
.sheet-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-top strong { font-size: 20px; font-family: var(--font-display); }
.x { appearance: none; border: 0; background: var(--surface); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--fg2); flex: none; }
.x .ico { width: 16px; height: 16px; }
.d-cover { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 10; margin-top: 4px; max-width: 100%; }
.d-cover img { width: 100%; height: 100%; object-fit: cover; }
.d-cover .x { position: absolute; right: 10px; top: 10px; background: rgba(0,0,0,.45); color: #fff; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.d-meta { display: flex; gap: 8px; align-items: center; margin-top: 16px; font-size: 13px; color: var(--fg2); font-weight: 600; }
.sheet h2 { font-family: var(--font-display); font-size: 27px; line-height: 1.12; letter-spacing: -.02em; margin: 8px 0 0; text-wrap: balance; }
.facts { list-style: none; margin: 16px 0; padding: 0; border-top: 1px solid var(--line); }
.facts li { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.facts .ico { color: var(--fg2); width: 20px; height: 20px; margin-top: 1px; }
.facts small { display: block; color: var(--fg2); font-size: 13px; }
.desc { font-size: 15.5px; line-height: 1.55; margin: 0 0 20px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { appearance: none; border: 1px solid var(--line-strong); background: none; border-radius: 10px; min-height: 50px; padding: 6px 12px; font-size: 15.5px; font-weight: 650; line-height: 1.2; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; color: var(--fg); }
.btn.wide { grid-column: 1 / -1; }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn[aria-pressed="true"] { color: var(--heart); border-color: var(--heart); }
.note { font-size: 12px; color: var(--fg2); text-align: center; margin: 14px 0 0; }
.cal-choice { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cal-choice .btn { background: var(--surface); border-color: transparent; }
.favlist { list-style: none; margin: 10px 0 0; padding: 0; }
.favlist li { display: grid; grid-template-columns: 52px minmax(0, 1fr) 44px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.favlist img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; }
.favlist .open { appearance: none; border: 0; background: none; text-align: left; padding: 0; cursor: pointer; min-width: 0; }
.favlist b { display: block; font-size: 15.5px; }
.favlist span { display: block; font-size: 13px; color: var(--fg2); margin-top: 2px; }
.fav-empty { text-align: center; color: var(--fg2); padding: 26px 0 10px; line-height: 1.5; }
.share-img { width: min(58vw, 240px); aspect-ratio: 9 / 16; border-radius: 14px; margin: 4px auto 16px; box-shadow: 0 12px 34px rgba(0,0,0,.28); max-width: 100%; -webkit-touch-callout: default; }
.share-hint { text-align: center; color: var(--fg2); font-size: 14px; line-height: 1.45; margin: 0 auto 16px; max-width: 36ch; }
.share .actions { grid-template-columns: 1fr; }

@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .backdrop, .sheet, .fav-btn.bump { animation: none; } .card .cv img { transition: none; } .card.lg .cv img { animation: none; } }
</style>
</head>
<body>

<header class="bar">
  <div class="wrap bar-in">
    <a class="brand" href="#" id="brand">Was ist los <span>in Chemnitz</span></a>
    <button class="fav-btn" id="favBtn" aria-label="Merkliste öffnen"></button>
  </div>
</header>

<main>
  <div class="wrap intro">
    <nav class="filters" id="filters" aria-label="Kategorien"></nav>
  </div>

  <!-- 1. Großes Karussell: Einmaliges und Besonderes -->
  <section class="wrap sec" aria-labelledby="hlTitle">
    <div class="sec-head">
      <h2 id="hlTitle">Besondere Momente</h2>
      <div class="arrows"><button class="arrow" data-scroll="heroRail" data-dir="-1" aria-label="Zurück"></button><button class="arrow" data-scroll="heroRail" data-dir="1" aria-label="Weiter"></button></div>
    </div>
    <div class="rail" id="heroRail" aria-roledescription="Karussell"></div>
  </section>

  <!-- 2. Tagesleiste -->
  <nav class="days" aria-label="Zu einem Zeitraum springen">
    <div class="wrap">
      <div class="days-strip" id="days"></div>
      <div class="later"><span>Später</span><div class="later-strip" id="later"></div><button class="today-btn" id="todayBtn">↑ Heute</button></div>
    </div>
  </nav>

  <!-- 3. Tagesliste -->
  <div class="wrap" id="list"></div>

  <!-- 4. Karussell: Regelmäßiges -->
  <section class="wrap sec" aria-labelledby="regTitle" style="margin-top:44px">
    <div class="sec-head">
      <div><h2 id="regTitle">Immer wieder</h2><p>Jede Woche oder jeden Monat</p></div>
      <div class="arrows"><button class="arrow" data-scroll="regRail" data-dir="-1" aria-label="Zurück"></button><button class="arrow" data-scroll="regRail" data-dir="1" aria-label="Weiter"></button></div>
    </div>
    <div class="rail" id="regRail"></div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>
  <footer class="wrap">Entwurf 4 · Alle Veranstaltungen sind erfunden · <a href="index.html">Alle Entwürfe</a>
    <nav class="legal" aria-label="Rechtliches"><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a><a href="#cookie-einstellungen">Cookie-Einstellungen</a></nav>
  </footer>
  <div class="consent" id="consent" role="dialog" aria-labelledby="consentTitle" hidden></div>
</main>

<script>
(function () {
  'use strict';

  /* =========================================================
     1. Kategorien und Beispieldaten (erfunden)
     ========================================================= */
  const CATEGORIES = [
    { id: 'musik',    name: 'Musik' },
    { id: 'markt',    name: 'Märkte' },
    { id: 'kultur',   name: 'Kultur' },

    { id: 'r32', wd: [1], time: '09:00', end: '12:00', cat: 'markt', freq: 'Jeden Montag', title: 'Trödelecke am Lessingplatz', place: 'Lessingplatz', district: 'Sonnenberg', price: 'Eintritt frei', desc: 'Kleiner Trödelmarkt mit Büchern, Geschirr und Schallplatten.' }
  ];

  const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
  const dayDate = n => { const d = new Date(TODAY); d.setDate(d.getDate() + n); return d; };
  const offset = d => Math.round((d - TODAY) / 864e5);   // Tage ab heute
  const H = offset(new Date(TODAY.getFullYear() + 2, TODAY.getMonth(), TODAY.getDate()));   // höchstens zwei Jahre voraus

  const EVENTS = [];
  SPECIAL.forEach(a => EVENTS.push({ id: a[0], day: a[1], time: a[2], end: a[3], cat: a[4], rhythm: a[5], rhythmText: a[6], title: a[7], place: a[8], district: a[9], price: a[10], desc: a[11], url: LINK + a[0], cover: a[0], date: dayDate(a[1]), ...MEDIA[a[0]] }));
  const pick = rng('beispieltage');   // zufällig, aber bei jedem Laden gleich
  for (let n = 0; n < H; n++) {
    const d = dayDate(n);
    if (n >= 7) {   // ab Tag 8: je Tag 1–5 weitere besondere Termine aus den Vorlagen
      const taken = new Set();
      for (let k = 1 + Math.floor(pick() * 5); k > 0; k--) {
        const f = FILL[Math.floor(pick() * FILL.length)], v = Math.floor(pick() * 3);
        if (taken.has(f[0])) continue;
        taken.add(f[0]);
        EVENTS.push({ id: `${f[0]}-${n}`, day: n, date: d, time: f[2], end: f[3], cat: f[1], rhythm: 'jaehrlich', rhythmText: 'Einmal im Jahr', title: f[8][v], place: f[4], district: f[5], price: f[6], desc: f[7], url: LINK + f[0], cover: `${f[0]}-${v}` });
      }
    }
    SERIES.forEach(s => {
      if (s.wd.includes(d.getDay())) EVENTS.push(Object.assign({}, s, { id: `${s.id}-${n}`, series: s.id, day: n, date: d, rhythm: 'regelmaessig', rhythmText: s.freq, url: LINK + s.id, cover: s.id }));
    });
  }
  EVENTS.sort((a, b) => a.day - b.day || a.time.localeCompare(b.time));
  const byId = id => EVENTS.find(e => e.id === id);
  const catName = id => CATEGORIES.find(c => c.id === id).name;

  /* =========================================================
     2. Speicher im Browser: Merkliste und Interessen nur nach Zustimmung
        (ohne Zustimmung gilt die Merkliste nur, solange die Seite offen ist, und die Seite lernt nichts)
     ========================================================= */
  const load = (k, f) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch (_) { return f; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };
  const drop = k => { try { localStorage.removeItem(k); } catch (_) {} };
  let consent = load('wilc4-einwilligung', null);   // 'ja', 'nein' oder null (noch nicht gefragt)
  const keep = () => { if (consent === 'ja') { save('wilc4-merkliste', favs); save('wilc4-interessen', interest); } };

  let favs = consent === 'ja' ? load('wilc4-merkliste', []) : [];
  let interest = consent === 'ja' ? load('wilc4-interessen', {}) : {};
  let active = new Set(CATEGORIES.map(c => c.id)); // beim Start: alle an

  const isFav = id => favs.includes(id);
  function toggleFav(id) {
    const ev = byId(id);
    if (isFav(id)) favs = favs.filter(x => x !== id);
    else { favs.push(id); if (ev) track(ev.cat, 2); }
    keep();
    syncHearts(id);
  }
  // Lernen: Veranstaltung öffnen = 1 Punkt, merken = 2, Kategorie wieder einschalten = 1
  function track(cat, pts) { if (consent !== 'ja') return; interest[cat] = Math.max(0, (interest[cat] || 0) + pts); keep(); }
  function affinity(cat) { const m = Math.max(0, ...Object.values(interest)); return m ? (interest[cat] || 0) / m : 0; }
  const topInterests = () => Object.entries(interest).filter(([, v]) => v >= 2).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id]) => catName(id));

  // Sortierung: Seltenheit zuerst, dann Interesse, dann Nähe
  const score = e => WEIGHT[e.rhythm] + affinity(e.cat) * 70 - e.day / 4;
  const rank = list => list.slice().sort((a, b) => score(b) - score(a) || a.day - b.day || a.time.localeCompare(b.time));
  const shown = e => active.has(e.cat);

  /* =========================================================
     3. Texte und Symbole
     ========================================================= */
  const WD = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  const MO = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  const yr = d => d.getFullYear() === TODAY.getFullYear() ? '' : ' ' + d.getFullYear();
  const fmtLong = d => `${WD[d.getDay()]}, ${d.getDate()}. ${MO[d.getMonth()]}${yr(d)}`;
  const relDay = n => n === 0 ? 'Heute' : n === 1 ? 'Morgen' : WD[dayDate(n).getDay()];
  const shortDate = e => e.day === 0 ? 'Heute' : e.day === 1 ? 'Morgen' : `${WD[e.date.getDay()].slice(0, 2)}, ${e.date.getDate()}. ${MO[e.date.getMonth()].slice(0, 3)}${yr(e.date)}`;
  const hm = t => t.endsWith(':00') ? String(+t.slice(0, 2)) : t.replace(/^0/, '');
  const span = e => `${hm(e.time)}–${hm(e.end)} Uhr`;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const svg = (p, fill) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="${fill ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const HEART = '<path d="M12 20.5s-7.5-4.6-9.3-9.4C1.4 7.6 3.6 4 7.2 4c2 0 3.6 1.1 4.8 2.8C13.2 5.1 14.8 4 16.8 4c3.6 0 5.8 3.6 4.5 7.1-1.8 4.8-9.3 9.4-9.3 9.4z"/>';
  const I = {
    heart: svg(HEART), heartFill: svg(HEART, true),
    share: svg('<path d="M12 3v12"/><path d="M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>'),
    close: svg('<path d="M6 6l12 12M18 6 6 18"/>'),
    cal: svg('<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'),
    clock: svg('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
    pin: svg('<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>'),
    ticket: svg('<path d="M4 7.5A1.5 1.5 0 0 1 5.5 6h13A1.5 1.5 0 0 1 20 7.5V10a2 2 0 0 0 0 4v2.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 16.5V14a2 2 0 0 0 0-4z"/>'),
    chat: svg('<path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/>'),
    out: svg('<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'),
    spark: svg('<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6.3 6.3l2.5 2.5M15.2 15.2l2.5 2.5M6.3 17.7l2.5-2.5M15.2 8.8l2.5-2.5"/>'),
    left: svg('<path d="m15 6-6 6 6 6"/>'), right: svg('<path d="m9 6 6 6-6 6"/>')
  };

  /* =========================================================
     4. Bunte Cover – werden aus dem Namen erzeugt
        (Platzhalter, bis echte Bilder kommen)
     ========================================================= */
  const PALETTES = [
    ['#FF5A36', '#FFC93C', '#1E3A8A', '#F7F3EA'], ['#0FA3B1', '#F7B32B', '#F2545B', '#191923'],
    ['#7B2CBF', '#FF6D00', '#FFD6A5', '#240046'], ['#06D6A0', '#118AB2', '#FFD166', '#073B4C'],
    ['#E63946', '#F1FAEE', '#457B9D', '#1D3557'], ['#FF70A6', '#FF9770', '#FFD670', '#70D6FF'],
    ['#3A86FF', '#FFBE0B', '#FB5607', '#FF006E'], ['#5F0F40', '#FB8B24', '#E36414', '#0F4C5C'],
    ['#22577A', '#38A3A5', '#80ED99', '#C7F9CC'], ['#F72585', '#4CC9F0', '#3A0CA3', '#FFFFFF'],
    ['#264653', '#2A9D8F', '#E9C46A', '#F4A261'], ['#111111', '#FF4F00', '#F2F0E6', '#3D5AFE']
  ];
  function rng(seed) {
    let s = 2166136261;
    for (const ch of seed) s = Math.imul(s ^ ch.charCodeAt(0), 16777619) >>> 0;
    return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
  }
  function paintCover(ctx, key, S) {
    const r = rng(key + 'chemnitz');
    const p = PALETTES[Math.floor(r() * PALETTES.length)].slice();
    for (let i = p.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
    const [a, b, c, d] = p;
    const circle = (x, y, rad, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill(); };
    ctx.fillStyle = a; ctx.fillRect(0, 0, S, S);
    const style = Math.floor(r() * 6);
    if (style === 0) {            // Sonne mit Streifen
      circle(S * (.35 + r() * .3), S * .52, S * .3, b);
      ctx.fillStyle = a;
      for (let i = 0; i < 6; i++) ctx.fillRect(0, S * (.56 + i * .065), S, S * (.012 + i * .006));
      ctx.fillStyle = c; ctx.fillRect(0, S * .86, S, S * .14);
    } else if (style === 1) {     // Bauhaus-Raster
      const w = S / 2, cols = [a, b, c, d];
      for (let gx = 0; gx < 2; gx++) for (let gy = 0; gy < 2; gy++) {
        const x = gx * w, y = gy * w, bg = cols[Math.floor(r() * 4)];
        let fg = cols[Math.floor(r() * 4)]; if (fg === bg) fg = cols[(cols.indexOf(bg) + 1) % 4];
        ctx.fillStyle = bg; ctx.fillRect(x, y, w, w);
        ctx.fillStyle = fg;
        const k = Math.floor(r() * 3);
        ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, w); ctx.clip();
        ctx.beginPath();
        if (k === 0) { const cx = x + (r() < .5 ? 0 : w), cy = y + (r() < .5 ? 0 : w); ctx.arc(cx, cy, w, 0, Math.PI * 2); }
        else if (k === 1) ctx.arc(x + w / 2, y + w / 2, w * .36, 0, Math.PI * 2);
        else ctx.arc(x + w / 2, y + w, w / 2, Math.PI, 0);
        ctx.fill(); ctx.restore();
      }
    } else if (style === 2) {     // Diagonale Streifen + Kreis
      ctx.save(); ctx.translate(S / 2, S / 2); ctx.rotate(Math.PI / 4 * (r() < .5 ? 1 : -1));
      ctx.fillStyle = b; const sw = S * .075;
      for (let x = -S; x < S; x += sw * 2) ctx.fillRect(x, -S, sw, S * 2);
      ctx.restore();
      circle(S * (.3 + r() * .4), S * (.3 + r() * .4), S * .26, c);
      circle(S * (.3 + r() * .4), S * (.3 + r() * .4), S * .1, d);
    } else if (style === 3) {     // Ringe aus einer Ecke
      const cx = r() < .5 ? 0 : S, cy = r() < .5 ? 0 : S, cols = [b, c, d, a];
      for (let i = 0; i < 12; i++) circle(cx, cy, S * (1.45 - i * .12), cols[i % 4]);
    } else if (style === 4) {     // Punkteraster
      const n = 4 + Math.floor(r() * 3), cw = S / n, cols = [b, c, d];
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) circle(cw * (i + .5), cw * (j + .5), cw * (.18 + r() * .3), cols[Math.floor(r() * 3)]);
    } else {                      // Wellen
      const cols = [b, c, d];
      for (let i = 0; i < 7; i++) {
        const y0 = S * (.12 + i * .13), amp = S * (.03 + r() * .05), ph = r() * 6;
        ctx.fillStyle = cols[i % 3]; ctx.beginPath(); ctx.moveTo(0, S);
        for (let x = 0; x <= S; x += S / 40) ctx.lineTo(x, y0 + Math.sin(x / S * Math.PI * 2 + ph) * amp);
        ctx.lineTo(S, S); ctx.closePath(); ctx.fill();
      }
    }
    // feines Korn, damit es weniger digital wirkt
    const img = ctx.getImageData(0, 0, S, S), px = img.data;
    for (let i = 0; i < px.length; i += 4) { const n = (r() - .5) * 18; px[i] += n; px[i + 1] += n; px[i + 2] += n; }
    ctx.putImageData(img, 0, 0);
  }
  const coverCache = {};
  const lazy = new IntersectionObserver(list => list.forEach(x => {
    if (!x.isIntersecting) return;
    lazy.unobserve(x.target);
    x.target.querySelectorAll('[data-cover]').forEach(el => { const k = el.tagName === 'VIDEO' ? 'poster' : 'src'; if (!el[k]) el[k] = cover(el.dataset.cover); });
  }), { rootMargin: '400px 0px' });
  function cover(key) {
    if (coverCache[key]) return coverCache[key];
    const S = 480, cv = document.createElement('canvas'); cv.width = cv.height = S;
    paintCover(cv.getContext('2d'), key, S);
    return (coverCache[key] = cv.toDataURL('image/jpeg', .86));
  }

  /* =========================================================
     5. Bausteine: Herz, Karten, Zeilen
     ========================================================= */
  const heartBtn = (ev, onCover) => {
    const on = isFav(ev.id), ico = on ? I.heartFill : I.heart;
    return `<button class="heart" data-fav="${ev.id}" aria-pressed="${on}" aria-label="${on ? 'Von Merkliste entfernen' : 'Merken'}">${onCover ? `<span>${ico}</span>` : ico}</button>`;
  };
  function card(ev, size) {
    const dateLine = `${ev.rhythm === 'regelmaessig' ? esc(ev.rhythmText) : shortDate(ev)} · ${hm(ev.time)} Uhr`;
    const media = ev.video ? `<video data-cover="${ev.cover}" data-video="${esc(ev.video)}" muted loop playsinline preload="none"></video>`
      : `<img data-cover="${ev.cover}" ${ev.webp ? `data-webp="${esc(ev.webp)}"` : ''} alt="">`;
    return `<article class="card ${size}" data-id="${ev.id}" tabindex="0" aria-label="${esc(ev.title)}">
      <div class="cv">${media}
        ${heartBtn(ev, true)}</div>
      <div class="c-date">${dateLine}</div>
      <h3>${esc(ev.title)}</h3>
      <div class="c-place">${esc(ev.place)}</div>
      ${size === 'sm' ? '' : `<div class="c-price">${esc(ev.price)}</div>`}
    </article>`;
  }
  function row(ev) {
    return `<div class="row" data-id="${ev.id}" tabindex="0" role="button" aria-label="${esc(ev.title)}, ${span(ev)}">
      <div class="time">${ev.time}<small>${ev.end}</small></div>
      <img class="thumb" data-cover="${ev.cover}" alt="">
      <div class="main"><div class="ti">${esc(ev.title)}</div>
        <div class="su">${esc(ev.place)}</div></div>
      <div class="cat">${catName(ev.cat)}</div>
      ${heartBtn(ev)}
    </div>`;
  }

  /* =========================================================
     6. Seite aufbauen
     ========================================================= */
  document.querySelectorAll('[data-dir="-1"]').forEach(b => b.innerHTML = I.left);
  document.querySelectorAll('[data-dir="1"]').forEach(b => b.innerHTML = I.right);

  function renderFilters() {
    const all = active.size === CATEGORIES.length;
    document.getElementById('filters').innerHTML =
      `<button class="flt all" data-cat="" aria-pressed="${all}">Alle</button>` +
      CATEGORIES.map(c => `<button class="flt" data-cat="${c.id}" aria-pressed="${active.has(c.id)}">${esc(c.name)}</button>`).join('');
  }

  // Kleine Blase unten, erscheint nach jeder Filteränderung für 7 Sekunden
  const toast = document.getElementById('toast');
  let toastTimer = 0;
  function showToast() {
    const top = topInterests();
    toast.innerHTML = `${I.spark}<span>Die Seite merkt sich, was dich interessiert, und sortiert passend.${top.length ? `<br><strong>Weiter oben: ${top.join(', ')}</strong>` : ''}</span>${top.length ? '<button id="resetLearn">Zurücksetzen</button>' : ''}`;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 7000);
  }

  function renderHero() {
    const list = rank(items.filter(e => e.rhythm !== 'regelmaessig')).slice(0, 30);
    heroRail.innerHTML = list.length ? list.map(e => card(e, 'lg')).join('') : `<p class="empty">Keine besonderen Termine in den gewählten Kategorien.</p>`;
    heroRail.scrollLeft = 0;
    live.disconnect();
    if (!reduced) heroRail.querySelectorAll('.card').forEach(c => live.observe(c));
  }
  // Nur ganz sichtbare Karten bewegen sich: Video läuft, WebP wird geladen, sonst Zoom.
  const live = new IntersectionObserver(list => list.forEach(({ target: c, isIntersecting: on }) => {
    c.classList.toggle('live', on);
    const v = c.querySelector('video'), w = c.querySelector('[data-webp]');
    if (v) { if (on) { if (!v.src) v.src = v.dataset.video; v.play().catch(() => {}); } else v.pause(); }
    if (w) w.src = on ? w.dataset.webp : cover(w.dataset.cover);
  }), { threshold: .9 });

  // Zeiträume der Leiste „Später“, alle aus dem heutigen Datum berechnet: Rest des Monats,
  // die nächsten drei Monate einzeln, Rest des Jahres, nächstes und übernächstes Jahr (bis höchstens zwei Jahre voraus)
  const PERIODS = (() => {
    const y = TODAY.getFullYear(), m = TODAY.getMonth(), list = [];
    const at = (yy, mm) => offset(new Date(yy, mm, 1));
    const add = (label, aria, from, to) => { from = Math.max(from, 7); to = Math.min(to, H); if (from < to) list.push({ label, aria, from, to }); };
    add(`Rest ${MO[m].slice(0, 3)}`, `Rest ${MO[m]}`, 7, at(y, m + 1));
    for (let i = 1; i <= 3; i++) { const d = new Date(y, m + i, 1); add(MO[d.getMonth()].slice(0, 3), `${MO[d.getMonth()]} ${d.getFullYear()}`, at(y, m + i), at(y, m + i + 1)); }
    const after = at(y, m + 4);
    add(`Rest ${y}`, `Rest ${y}`, after, at(y + 1, 0));
    add(String(y + 1), String(y + 1), Math.max(after, at(y + 1, 0)), at(y + 2, 0));
    add(String(y + 2), String(y + 2), Math.max(after, at(y + 2, 0)), H);
    return list;
  })();

  function renderDays() {
    const cnt = new Array(H).fill(0), special = [];
    items.forEach(e => { cnt[e.day]++; if (e.rhythm !== 'regelmaessig') special[e.day] = true; });
    const any = (a, b) => cnt.slice(a, b).some(Boolean);
    let html = '';
    for (let n = 0; n < 7; n++) {
      const d = dayDate(n);
      html += `<button class="dbtn" data-from="${n}" data-to="${n + 1}" ${cnt[n] ? '' : 'disabled'} aria-label="${relDay(n)}, ${d.getDate()}. ${MO[d.getMonth()]}">
        <small>${n === 0 ? 'Heute' : n === 1 ? 'Morgen' : WD[d.getDay()].slice(0, 2)}</small><b>${d.getDate()}</b>${special[n] ? '<span class="dot" title="Besonderes an diesem Tag"></span>' : ''}</button>`;
    }
    document.getElementById('days').innerHTML = html;
    document.getElementById('later').innerHTML = PERIODS.map(p => `<button class="pbtn" data-from="${p.from}" data-to="${p.to}" ${any(p.from, p.to) ? '' : 'disabled'} aria-label="${p.aria}">${p.label}</button>`).join('');
    spy(true);
  }

  // Liste: zuerst höchstens 200 Termine Tag für Tag, dann mit „Weitere … anzeigen“ jeweils 50 mehr.
  // Springt man weit nach vorn (z. B. „2028“), beginnt die Liste dort.
  let items = [], listStart = 0, listLimit = 200;
  function renderList() {
    const part = items.slice(listStart, listStart + listLimit);
    const days = [...new Set(part.map(e => e.day))];
    const all = new Map(days.map(n => [n, []]));
    items.forEach(e => { const a = all.get(e.day); if (a) a.push(e); });
    let html = days.map(n => {
      const d = dayDate(n), day = all.get(n), hl = dayHighlights(day);
      return `<section class="day" id="tag-${n}" data-day="${n}">
        <div class="day-h"><h2>${relDay(n)}</h2><span class="d">${n < 2 ? WD[d.getDay()] + ', ' : ''}${d.getDate()}. ${MO[d.getMonth()]}${yr(d)}</span><span class="n">${day.length} ${day.length === 1 ? 'Termin' : 'Termine'}</span></div>
        <div class="rail" aria-label="Highlights"><div class="track">${hl.map(e => card(e, 'sm')).join('')}</div></div>
        <div class="table">${part.filter(e => e.day === n).map(row).join('')}</div>
      </section>`;
    }).join('') || `<p class="empty">Keine Termine in den gewählten Kategorien.</p>`;
    const rest = items.length - listStart - part.length;
    if (rest > 0) html += `<div class="more"><button class="btn" data-more>Weitere ${Math.min(50, rest)} anzeigen</button></div>`;
    document.getElementById('list').innerHTML = html;
    document.querySelectorAll('.day .rail').forEach(r => autoScroll(r, 22));
    document.querySelectorAll('.day').forEach(el => lazy.observe(el));
  }
  function dayHighlights(all) {
    const special = rank(all.filter(e => e.rhythm !== 'regelmaessig'));
    if (special.length >= 3) return special;
    return special.concat(rank(all.filter(e => e.rhythm === 'regelmaessig')).slice(0, 3 - special.length));
  }

  function renderRegular() {
    const seen = new Set(), list = [];
    items.filter(e => e.rhythm === 'regelmaessig')
      .forEach(e => { if (!seen.has(e.series)) { seen.add(e.series); list.push(e); } });
    list.sort((a, b) => affinity(b.cat) - affinity(a.cat) || a.day - b.day);
    const reg = document.getElementById('regRail');
    reg.innerHTML = list.length ? `<div class="track">${list.map(e => card(e, 'md')).join('')}</div>` : `<p class="empty">Keine regelmäßigen Termine in den gewählten Kategorien.</p>`;
    autoScroll(reg, 22);
  }

  function renderFavBtn() {
    const n = favs.length;
    document.getElementById('favBtn').innerHTML = `${n ? I.heartFill : I.heart}Merkliste${n ? ` <span class="n">${n}</span>` : ''}`;
  }

  function renderAll() {
    items = EVENTS.filter(shown);   // schon nach Datum sortiert
    listStart = 0; listLimit = 200;
    renderFilters(); renderHero(); renderDays(); renderList(); renderRegular(); renderFavBtn();
    document.querySelectorAll('#heroRail, #regRail').forEach(el => lazy.observe(el));
  }

  // Herz umschalten, ohne die Seite neu aufzubauen (Karussells bleiben an ihrer Stelle)
  function syncHearts(id) {
    const on = isFav(id);
    document.querySelectorAll(`[data-fav="${id}"]`).forEach(b => {
      b.setAttribute('aria-pressed', on);
      b.setAttribute('aria-label', on ? 'Von Merkliste entfernen' : 'Merken');
      const inner = b.querySelector('span');
      (inner || b).innerHTML = on ? I.heartFill : I.heart;
    });
    renderFavBtn();
    if (on) { const f = document.getElementById('favBtn'); f.classList.remove('bump'); void f.offsetWidth; f.classList.add('bump'); }
  }

  /* =========================================================
     7. Bedienung
     ========================================================= */
  document.getElementById('filters').addEventListener('click', e => {
    const b = e.target.closest('.flt'); if (!b) return;
    const id = b.dataset.cat;
    if (!id) active = new Set(CATEGORIES.map(c => c.id));
    else if (active.has(id)) active.delete(id);
    else { active.add(id); track(id, 1); }
    renderAll();
    showToast();
  });

  document.addEventListener('click', e => {
    if (e.target.closest('.backdrop')) return;
    const f = e.target.closest('[data-fav]');
    if (f) { e.stopPropagation(); toggleFav(f.dataset.fav); return; }
    const s = e.target.closest('[data-scroll]');
    if (s) { const r = document.getElementById(s.dataset.scroll); pause(r, 3000); r.scrollBy({ left: s.dataset.dir * r.clientWidth * .8, behavior: 'smooth' }); return; }
    if (e.target.id === 'resetLearn') { interest = {}; keep(); toast.hidden = true; renderAll(); return; }
    const day = e.target.closest('.dbtn, .pbtn');
    if (day) { jumpTo(+day.dataset.from, +day.dataset.to); return; }
    if (e.target.closest('[data-more]')) { listLimit += 50; renderList(); return; }
    const item = e.target.closest('[data-id]');

  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-id]')) { e.preventDefault(); e.target.click(); }
  });
  document.getElementById('favBtn').addEventListener('click', openFavorites);
  document.getElementById('brand').addEventListener('click', e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); });

  // Tagesleiste: springen + aktuellen Tag markieren
  function stickyOffset() {
    const bar = document.querySelector('.bar').getBoundingClientRect().bottom;
    return bar + document.querySelector('.days').offsetHeight;
  }
  function jumpTo(from, to) {   // sanft zum ersten Termin des Zeitraums
    const i = items.findIndex(e => e.day >= from && e.day < to); if (i < 0) return;
    const n = items[i].day;
    if (i < listStart || i >= listStart + listLimit) {   // liegt außerhalb der Liste: Liste dort beginnen
      listStart = items.findIndex(e => e.day === n); listLimit = 200; renderList();
    }
    const y = document.getElementById('tag-' + n).getBoundingClientRect().top + window.scrollY - stickyOffset() + 1;
    window.scrollTo({ top: y, behavior: reduced ? 'auto' : 'smooth' });
    markDay(n);
  }
  document.getElementById('todayBtn').addEventListener('click', () => {
    if (listStart) { listStart = 0; listLimit = 200; renderList(); }
    window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
  });
  let current = -1;
  function markDay(n) {
    if (n === current) return;
    current = n;
    document.querySelectorAll('.dbtn, .pbtn').forEach(b => {
      const on = n >= +b.dataset.from && n < +b.dataset.to, strip = b.parentElement;
      b.setAttribute('aria-current', on);
      if (on) strip.scrollTo({ left: b.offsetLeft - strip.offsetLeft - strip.clientWidth / 2 + b.offsetWidth / 2, behavior: reduced ? 'auto' : 'smooth' });
    });
  }
  function spy(force) {
    const off = stickyOffset() + 8, secs = document.querySelectorAll('.day');
    let n = secs.length ? +secs[0].dataset.day : 0;
    secs.forEach(s => { if (s.getBoundingClientRect().top <= off) n = +s.dataset.day; });
    if (force) current = -1;
    markDay(n);
  }
  let spyRaf = 0;
  window.addEventListener('scroll', () => { cancelAnimationFrame(spyRaf); spyRaf = requestAnimationFrame(() => spy()); }, { passive: true });

  // Karussells: Das obere bleibt ca. 3 Sekunden stehen und schwenkt dann zur nächsten Karte.
  // Die unteren gleiten gleichmäßig: ganze Pixel über die Scroll-Position, Bruchteile über eine
  // Verschiebung der Kartenreihe (läuft auf der Grafikkarte, deshalb ohne Ruckeln).
  // Kopien der Karten hängen hinten an, damit es endlos weitergeht.
  // Anfassen, Wischen oder Maus darüber hält kurz an.
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const heroRail = document.getElementById('heroRail');
  const hold = new WeakMap();   // Karussell -> angehalten bis
  const held = rail => Date.now() < (hold.get(rail) || 0);
  function pause(rail, ms) { hold.set(rail, Date.now() + ms); }
  function watchTouch(rail) {
    if (rail.dataset.watched) return;
    rail.dataset.watched = '1';
    ['pointerdown', 'focusin'].forEach(t => rail.addEventListener(t, () => pause(rail, Infinity), { passive: true }));
    ['pointerup', 'pointercancel', 'touchend', 'focusout', 'wheel'].forEach(t => rail.addEventListener(t, () => pause(rail, 2500), { passive: true }));
    rail.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') pause(rail, Infinity); });
    rail.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') pause(rail, 1000); });
  }

  watchTouch(heroRail);
  if (!reduced) setInterval(() => {
    if (held(heroRail) || document.hidden || document.querySelector('.backdrop')) return;
    const first = heroRail.querySelector('.card'); if (!first) return;
    const step = first.offsetWidth + 12, max = heroRail.scrollWidth - heroRail.clientWidth;
    heroRail.scrollTo({ left: heroRail.scrollLeft + step > max + 2 ? 0 : heroRail.scrollLeft + step, behavior: 'smooth' });
  }, 3500);

  const running = new Map();   // Karussell -> { track, set, speed, pos, whole, visible, resync }
  const seen = new IntersectionObserver(list => list.forEach(x => { const a = running.get(x.target); if (a) a.visible = x.isIntersecting; }));
  function autoScroll(rail, speed) {
    const track = rail.querySelector('.track');
    const items = track ? [...track.children] : [];
    if (reduced || items.length < 2) { running.delete(rail); return; }
    const last = items[items.length - 1];
    const set = last.offsetLeft + last.offsetWidth + parseFloat(getComputedStyle(track).columnGap) - items[0].offsetLeft;
    for (let k = Math.ceil(rail.clientWidth / set); k > 0; k--) items.forEach(el => {
      const c = el.cloneNode(true);
      c.setAttribute('aria-hidden', 'true');
      c.tabIndex = -1; c.querySelectorAll('button').forEach(b => { b.tabIndex = -1; });
      track.appendChild(c);
    });
    watchTouch(rail);
    seen.observe(rail);
    running.set(rail, { track, set, speed, pos: 0, whole: -1, visible: true, resync: false });
  }
  let lastT = 0;
  function tick(t) {
    const dt = lastT ? Math.min(t - lastT, 50) : 0; lastT = t;
    if (!document.hidden && !document.querySelector('.backdrop')) running.forEach((a, rail) => {
      if (!rail.isConnected) { seen.unobserve(rail); running.delete(rail); return; }
      if (!a.visible) return;
      if (held(rail)) { a.resync = true; return; }
      if (a.resync) { a.pos = rail.scrollLeft; a.whole = -1; a.resync = false; }   // nach dem Wischen dort weitermachen
      a.pos += a.speed * dt / 1000;
      if (a.pos >= a.set) a.pos -= a.set;
      const whole = Math.floor(a.pos);
      if (whole !== a.whole) { rail.scrollLeft = whole; a.whole = whole; }
      a.track.style.transform = `translate3d(${(whole - a.pos).toFixed(2)}px,0,0)`;
    });
    requestAnimationFrame(tick);
  }
  if (!reduced) requestAnimationFrame(tick);

  /* =========================================================
     8. Fenster: Details, Merkliste, Teilen
     ========================================================= */
  function openSheet(html, cls) {
    const back = document.createElement('div');
    back.className = 'backdrop ' + (cls || '');
    back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
    const close = () => { back.remove(); document.removeEventListener('keydown', onKey); if (!document.querySelector('.backdrop')) document.body.style.overflow = ''; };
    const onKey = e => { if (e.key === 'Escape' && back === [...document.querySelectorAll('.backdrop')].pop()) close(); };
    back.addEventListener('click', e => { if (e.target === back || e.target.closest('[data-close]')) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(back);
    document.body.style.overflow = 'hidden';
    const c = back.querySelector('[data-close]'); if (c) c.focus({ preventScroll: true });
    return { el: back, sheet: back.querySelector('.sheet'), close };
  }

  function openDetail(ev) {
    if (!ev) return;
    track(ev.cat, 1);
    const favLabel = () => isFav(ev.id) ? I.heartFill + 'Gemerkt' : I.heart + 'Merken';
    const s = openSheet(`
      <div class="d-cover"><img src="${cover(ev.cover)}" alt=""><button class="x" data-close aria-label="Schließen">${I.close}</button></div>
      <div class="d-meta">${catName(ev.cat)}</div>
      <h2>${esc(ev.title)}</h2>
      <ul class="facts">
        <li>${I.cal}<span>${fmtLong(ev.date)}<small>${relDay(ev.day)}</small></span></li>
        <li>${I.clock}<span>${span(ev)}</span></li>
        <li>${I.pin}<span>${esc(ev.place)}<small>${esc(ev.district)}</small></span></li>
        <li>${I.ticket}<span>${esc(ev.price)}</span></li>
      </ul>
      <p class="desc">${esc(ev.desc)}</p>
      <div class="actions">
        <button class="btn" data-dfav aria-pressed="${isFav(ev.id)}">${favLabel()}</button>
        <button class="btn primary" data-dshare>${I.share}Teilen</button>
        <button class="btn wide" data-dcal aria-expanded="false">${I.cal}In den Kalender eintragen</button>
        <div class="cal-choice" hidden>
          <button class="btn" data-ics>Apple Kalender</button>
          <a class="btn" href="${googleCal(ev)}" target="_blank" rel="noopener">Google Kalender</a>
        </div>
        <a class="btn wide" href="${esc(ev.url)}" target="_blank" rel="noopener">${I.out}Zum Veranstalter</a>
      </div>
      <p class="note">Beispielveranstaltung, erfundene Daten</p>`);
    s.sheet.addEventListener('click', e => {
      const b = e.target.closest('[data-dfav]');
      if (b) { toggleFav(ev.id); b.setAttribute('aria-pressed', isFav(ev.id)); b.innerHTML = favLabel(); }
      if (e.target.closest('[data-dshare]')) share(ev);
      const c = e.target.closest('[data-dcal]');
      if (c) { const box = s.sheet.querySelector('.cal-choice'); box.hidden = !box.hidden; c.setAttribute('aria-expanded', !box.hidden); }
      if (e.target.closest('[data-ics]')) addToCalendar(ev);
    });
  }

  /* ----- Kalender ----- */
  const where = ev => `${ev.place}, ${ev.district}, Chemnitz`;
  const stamp = (d, t) => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}T${t.replace(':', '')}00`;
  function times(ev) {   // endet es nach Mitternacht, zählt der nächste Tag
    const endDay = new Date(ev.date);
    if (ev.end <= ev.time) endDay.setDate(endDay.getDate() + 1);
    return [stamp(ev.date, ev.time), stamp(endDay, ev.end)];
  }
  function addToCalendar(ev) {   // Apple Kalender: Kalenderdatei (ICS), öffnet sich auf dem iPhone direkt im Kalender
    const [a, b] = times(ev), t = v => v.replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Was ist los in Chemnitz//DE', 'BEGIN:VEVENT',
      `UID:${ev.id}-${a}@was-ist-los-in-chemnitz`, `DTSTAMP:${new Date().toISOString().replace(/[-:]|\.\d+/g, '')}`,
      `DTSTART:${a}`, `DTEND:${b}`, `SUMMARY:${t(ev.title)}`, `LOCATION:${t(where(ev))}`,
      `DESCRIPTION:${t(ev.desc + '\n' + ev.url)}`, `URL:${ev.url}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
    link.download = 'veranstaltung.ics';
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 10000);
  }
  function googleCal(ev) {
    const [a, b] = times(ev), q = encodeURIComponent;
    return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${q(ev.title)}&dates=${a}/${b}&ctz=Europe/Berlin&location=${q(where(ev))}&details=${q(ev.desc + '\n' + ev.url)}`;
  }

  function openFavorites() {
    const body = () => {
      const list = favs.map(byId).filter(Boolean).sort((a, b) => a.day - b.day || a.time.localeCompare(b.time));
      return `<div class="sheet-top"><strong>Merkliste</strong><button class="x" data-close aria-label="Schließen">${I.close}</button></div>
        ${list.length ? `<ul class="favlist">${list.map(e => `<li><img src="${cover(e.cover)}" alt="">
          <button class="open" data-open="${e.id}"><b>${esc(e.title)}</b><span>${shortDate(e)}, ${hm(e.time)} Uhr · ${esc(e.place)}</span></button>
          <button class="heart" data-unfav="${e.id}" aria-pressed="true" aria-label="Von Merkliste entfernen">${I.heartFill}</button></li>`).join('')}</ul>
          <p class="note">Nur auf diesem Gerät gespeichert, ohne Konto.</p>`

    };
    const s = openSheet(body());
    s.sheet.addEventListener('click', e => {

  /* ----- Story-Bild 1080 × 1920 ----- */
  function wrap(ctx, text, maxW) {
    const words = text.split(' '), lines = []; let line = '';
    words.forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
    if (line) lines.push(line); return lines;
  }
  function drawStory(ev) {
    const W = 1080, H = 1920, P = 100;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    const F = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif';
    x.fillStyle = '#0B0B0C'; x.fillRect(0, 0, W, H);

    // Cover groß oben (Instagram lässt oben ~250 px frei)
    const S = W - P * 2, top = 270;
    const art = document.createElement('canvas'); art.width = art.height = S;
    paintCover(art.getContext('2d'), ev.cover, S);
    x.save(); x.beginPath();
    if (x.roundRect) x.roundRect(P, top, S, S, 36); else x.rect(P, top, S, S);
    x.clip(); x.drawImage(art, P, top); x.restore();

    let y = top + S + 90;
    // Kategorie
    x.font = `700 32px ${F}`;
    if ('letterSpacing' in x) x.letterSpacing = '3px';
    x.fillStyle = '#FFFFFF';
    x.fillText(catName(ev.cat).toUpperCase(), P, y);
    if ('letterSpacing' in x) x.letterSpacing = '0px';

    // Titel (max. 3 Zeilen)
    let size = 84, lines;
    do { x.font = `800 ${size}px ${F}`; lines = wrap(x, ev.title, W - P * 2); size -= 4; } while (lines.length > 3 && size > 52);
    size += 4; x.font = `800 ${size}px ${F}`; x.fillStyle = '#FFFFFF';
    y += 30;
    lines.slice(0, 3).forEach((l, i) => x.fillText(l, P, y + size + i * size * 1.06));
    y += size + (Math.min(lines.length, 3) - 1) * size * 1.06 + 64;

    // Datum, Zeit, Ort
    x.font = `700 46px ${F}`; x.fillStyle = '#FFFFFF';
    x.fillText(`${fmtLong(ev.date)} · ${span(ev)}`, P, y);
    x.font = `500 40px ${F}`; x.fillStyle = 'rgba(255,255,255,.72)';
    x.fillText(wrap(x, `${ev.place}, ${ev.district}`, W - P * 2)[0], P, y + 58);

    x.font = `700 30px ${F}`; x.fillStyle = 'rgba(255,255,255,.5)';
    if ('letterSpacing' in x) x.letterSpacing = '4px';
    x.fillText('WAS IST LOS IN CHEMNITZ', P, H - 300);
    return c;
  }
  // Teilen: öffnet das Teilen-Menü des Handys mit fertigem Text und Story-Bild
  // (WhatsApp, Instagram-Story usw.). Wo es das nicht gibt, z. B. am Computer,
  // erscheint das Story-Bild in einem Fenster über der Veranstaltung.
  const shareText = ev => `${ev.title}\n${fmtLong(ev.date)}, ${span(ev)}\n${ev.place}, ${ev.district}\n${ev.url}`;
  function share(ev) {
    const url = drawStory(ev).toDataURL('image/png');
    let data = null;
    try {
      const bin = atob(url.split(',')[1]), arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      data = { title: ev.title, text: shareText(ev), files: [new File([arr], 'chemnitz-story.png', { type: 'image/png' })] };
    } catch (_) {}
    if (data && navigator.canShare && navigator.canShare(data)) navigator.share(data).catch(err => { if (err.name !== 'AbortError') showStory(ev, url); });
    else showStory(ev, url);
  }
  function showStory(ev, url) {
    openSheet(`
      <div class="sheet-top"><strong>Story-Bild</strong><button class="x" data-close aria-label="Zurück zur Veranstaltung">${I.close}</button></div>
      <img class="share-img" src="${url}" alt="Story-Bild: ${esc(ev.title)}, ${fmtLong(ev.date)}, ${esc(ev.place)}">
      <p class="share-hint">Bild gedrückt halten und „Teilen…“ oder „Zu Fotos hinzufügen“ wählen. Am Computer: Rechtsklick, „Bild speichern“.</p>
      <div class="actions"><a class="btn" href="https://wa.me/?text=${encodeURIComponent(shareText(ev))}" target="_blank" rel="noopener">${I.chat}Per WhatsApp teilen</a><button class="btn" data-close>Fertig</button></div>`, 'share');
  }

  /* ----- Hinweis zur Speicherung und Cookie-Einstellungen ----- */
  const consentBox = document.getElementById('consent');
  function showConsent(settings, note) {
    const state = { ja: 'zugestimmt', nein: 'abgelehnt' }[consent] || 'noch nicht entschieden';
    consentBox.innerHTML = `<div class="consent-in">
      <p><strong id="consentTitle">${settings ? 'Cookie-Einstellungen' : 'Speichern auf deinem Gerät'}</strong><br>
        Die Seite kann auf deinem Gerät speichern, was du dir merkst und was dich interessiert, damit sie dir passende Veranstaltungen zeigt. Es wird nichts an uns übertragen. <a href="datenschutz.html#speicherung">Datenschutzerklärung</a></p>
      ${settings ? `<p>Deine Wahl: <strong>${state}</strong>${note ? ` · ${note}` : ''}</p>` : ''}
      <div class="actions"><button class="btn" data-consent="nein">Ablehnen</button><button class="btn" data-consent="ja">Zustimmen</button></div>
      ${settings ? '<div class="actions"><button class="btn" data-wipe>Gespeicherte Daten löschen</button><button class="btn" data-shut>Schließen</button></div>' : ''}
    </div>`;
    consentBox.hidden = false;
    document.body.style.paddingBottom = consentBox.offsetHeight + 'px';   // damit nichts verdeckt bleibt
  }
  function hideConsent() {
    consentBox.hidden = true;
    document.body.style.paddingBottom = '';
    if (location.hash === '#cookie-einstellungen') history.replaceState(null, '', location.pathname);
  }
  consentBox.addEventListener('click', e => {
    const c = e.target.closest('[data-consent]');
    if (c) {
      consent = c.dataset.consent;
      save('wilc4-einwilligung', consent);   // die Entscheidung selbst darf gespeichert werden
      if (consent === 'ja') keep();
      else { drop('wilc4-merkliste'); drop('wilc4-interessen'); interest = {}; renderAll(); }
      hideConsent();
    }
    if (e.target.closest('[data-wipe]')) {
      drop('wilc4-merkliste'); drop('wilc4-interessen');
      favs = []; interest = {};
      renderAll();
      showConsent(true, 'Gespeicherte Daten gelöscht');
    }
    if (e.target.closest('[data-shut]')) hideConsent();
  });
  const route = () => { if (location.hash === '#cookie-einstellungen') showConsent(true); };
  window.addEventListener('hashchange', route);

  renderAll();
  if (consent === null) showConsent(false);
  route();
})();
</script>
</body>
</html>
